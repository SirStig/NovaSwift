; Godot export presets — see docs/PACKAGING.md.
;
; Native libraries: godot/NovaSwift.gdextension maps libNovaSwiftGodot.{so,dll,
; dylib} per platform and Godot copies the matching one next to the exported
; executable (its [dependencies] block adds libSwiftGodot). The Swift RUNTIME
; libraries a Linux/Windows machine without Swift needs are NOT known to Godot;
; scripts/package-linux.sh (and the CI Windows step) copy them next to the
; executable after the export.
;
; BYO data: nothing from data/ is ever exported. EV Nova data is found at
; runtime (NOVA_DATA_DIR, saved path, ../data/base, user://data,
; ~/.local/share/NovaSwift/data). `exclude_filter` also keeps tests, the bridge
; sources and any stray .build output out of the .pck.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, bridge/*, export/*, bin/*, data/*, *.md, *.dylib, *.dll, .build/*, **/.build/*"
export_path="export/linux/NovaSwift.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

