; NOVA Swift dedicated server configuration (example).
;   cp godot/net/server.cfg my-server.cfg   then   scripts/run-dedicated-server.sh --config my-server.cfg
; Command-line flags override this file. NOVA_SERVER_CONFIG=/path/to/file also works.

[server]
name="My NovaSwift Server"
; UDP game port. Forward it on your router for internet play. Status pings use port + 1.
port=53735
max_players=8
; Empty = no password. Sent as a hash, game traffic is NOT encrypted: don't reuse a password that matters.
password=""
; safe (sparring: PvP damage and death aren't real) | full (real stakes) | custom (uses [rules] below)
rules="safe"
; Announce on the local network (UDP broadcast to 53736).
lan=true
; Read console commands (status, players, kick, ban, say, rules, quit) from stdin. Set false under systemd.
stdin=true
; EV Nova data folder; empty = NOVA_DATA_DIR / the folder the game imported.
data=""
; Log file; empty = user://logs/server.log
log=""

; Remove the comment marks to use custom rules (base = safe or full, then the toggles).
;[rules]
;base="safe"
;allow_pvp=true
;pvp_damage_real=false
;friendly_fire=false
;death_real=false
;allow_trade=true
;carry_encounter=false
;game_speed=1.0
