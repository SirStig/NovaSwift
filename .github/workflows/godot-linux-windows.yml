name: Godot layer (Linux/Windows)

# Guards the cross-platform Swift core and the SwiftGodot bridge that make up the
# desktop Linux/Windows frontend. See docs/GODOT_LAYER.md.
#
# The Apple app (app/NovaSwift, Xcode) is untouched by this workflow — it builds
# only the SwiftPM packages.

# Manual-only (maintainer decision, 2026-10-13): Godot packages are built and
# released locally (scripts/package-*.sh, docs/PACKAGING.md), so this workflow
# no longer runs on push, tag or PR. Run it by hand from the Actions tab if wanted.
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Also build the downloadable Linux/Windows packages"
        type: boolean
        default: true

permissions:
  contents: read

env:
  # Must match the Godot the project is developed against (docs/GODOT_LAYER.md
  # version matrix; project.godot says 4.6 is the FLOOR, we ship 4.7.x).
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"

# Every job pins Swift 6.3, the toolchain this code is developed against and the
# minimum SwiftGodot's `main` requires. The jobs previously ran 5.10, which no
# part of the project was ever built or verified against — on Linux its older
# corelibs Foundation lacks `Sendable` conformances the sources assume, and on
# Windows its ucrt module shims can't parse the current Windows SDK headers.
jobs:
  # Required signal: the libraries the Godot layer depends on compile on Linux.
  # These were audited clean of Apple-only frameworks (docs/GODOT_LAYER.md).
  core-linux:
    name: Core builds on Linux
    runs-on: ubuntu-latest
    container: swift:6.3-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Build NovaSwiftEngine (+ NovaSwiftKit)
        run: swift build --target NovaSwiftEngine

  # Informational: the entire root package on Linux (extractor, story, net with
  # its Apple transports compiled out, plugin store). Surfaces any remaining
  # portability gaps without blocking the required check.
  full-core-linux:
    name: Full package on Linux (informational)
    runs-on: ubuntu-latest
    container: swift:6.3-jammy
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build whole package
        run: swift build

  # Informational: the same core on Windows, where Foundation has its own edges.
  #
  # Also pinned to windows-2022, not windows-latest: the latter now means Windows
  # Server 2025 + VS 2026, a much newer MSVC than the Swift toolchain is tested
  # against. Both the runner image and the toolchain matter here — on 5.10 this
  # job failed on *either* image with "cyclic dependency in module 'ucrt'" as
  # soon as anything needed a C module built (swift-crypto's C target was the
  # first dependency to trigger it).
  core-windows:
    name: Core builds on Windows (informational)
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift toolchain
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.3.3-release
          tag: 6.3.3-RELEASE
      - name: Build NovaSwiftEngine (+ NovaSwiftKit)
        run: swift build --target NovaSwiftEngine

  # Informational: the SwiftGodot GDExtension bridge (fetches SwiftGodot, links
  # the native library). Promote to required once verified on a real toolchain.
  # SwiftGodot's `main` (which this bridge is intentionally pinned to — see
  # godot/bridge/Package.swift) is what sets the 6.3 floor shared above.
  bridge-linux:
    name: GDExtension bridge on Linux (informational)
    runs-on: ubuntu-latest
    container: swift:6.3-jammy
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build the NovaSwiftGodot bridge
        run: scripts/build-gdextension.sh release

  # ---------------------------------------------------------------------------
  # Distributable builds. Run on version tags and on manual dispatch (package
  # input, default on). Output: downloadable artifacts (and, on a tag, files on
  # the GitHub release). No EV Nova data is ever packaged.
  # ---------------------------------------------------------------------------

  # Linux x86_64 for Steam Deck. Built inside jammy (glibc 2.35) so the result
  # runs on SteamOS 3 (glibc 2.38+). The Swift runtime ships beside the .so.
  package-linux:
    name: Package Linux x86_64 (Steam Deck)
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.package)
    runs-on: ubuntu-latest
    container: swift:6.3-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: apt-get update && apt-get install -y --no-install-recommends unzip curl ca-certificates binutils patchelf
      - name: Cache Godot + export templates
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}-linux-templates-v1
      - name: Install Godot (headless editor) + Linux/Windows export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          mkdir -p ~/godot-dl && cd ~/godot-dl
          [ -f godot.zip ] || curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          [ -f templates.tpz ] || curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          unzip -oq godot.zip
          install -m 755 "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          # The .tpz is ~1.3 GB (all platforms); only unpack what we export.
          tdir=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p "$tdir"
          unzip -oqj templates.tpz 'templates/version.txt' 'templates/linux_*' 'templates/windows_*' -d "$tdir"
          ls "$tdir"
          godot --version
      - name: Build, export, package
        run: scripts/package-linux.sh
      - name: Smoke test the exported build (extension must load, no data needed)
        run: |
          cd godot/export/linux
          timeout 60 ./NovaSwift.x86_64 --headless --quit-after 30 2>&1 | tee smoke.log || true
          if grep -Ei "can't open dynamic library|failed to load|GDExtension.*error" smoke.log; then
            echo "extension failed to load"; exit 1
          fi
          rm -f smoke.log
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: NovaSwift-linux-x86_64
          path: godot/export/NovaSwift-linux-x86_64.tar.gz
          if-no-files-found: error

  # Windows x86_64. Best effort: the Windows bridge build is still informational
  # (continue-on-error) until it is proven on a real toolchain.
  package-windows:
    name: Package Windows x86_64 (best effort)
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.package)
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift toolchain
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.3.3-release
          tag: 6.3.3-RELEASE
      - name: Build the bridge
        shell: bash
        run: scripts/build-gdextension.sh release
      - name: Install Godot + Windows export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          mkdir -p ../godot-dl && cd ../godot-dl
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_win64.exe.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          unzip -oq godot.zip
          tdir="$APPDATA/Godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$tdir"
          unzip -oqj templates.tpz 'templates/version.txt' 'templates/windows_*' -d "$tdir"
      - name: Export and bundle the Swift runtime
        shell: bash
        run: |
          set -euo pipefail
          godot="$(cd ../godot-dl && pwd)/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_win64_console.exe"
          out=godot/export/windows
          mkdir -p "$out"
          "$godot" --headless --path godot --import || true
          "$godot" --headless --path godot --export-release "Windows" "$PWD/$out/NovaSwift.exe"
          cp -f godot/bin/*.dll "$out/"
          # Swift runtime DLLs (swiftCore, Foundation, ...) from the toolchain.
          rt="$(dirname "$(find "/c/Program Files/Swift" -iname swiftCore.dll | head -1)")"
          echo "Swift runtime dir: $rt"
          cp -f "$rt"/*.dll "$out/"
          printf 'NOVA Swift (Windows). No game data included: set the EV Nova data folder in-game (Game Data).\r\nRequires the Microsoft Visual C++ Redistributable (x64).\r\n' > "$out/README.txt"
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path godot/export/windows/* -DestinationPath godot/export/NovaSwift-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NovaSwift-windows-x86_64
          path: godot/export/NovaSwift-windows-x86_64.zip
          if-no-files-found: error

  # On a version tag, attach the packages to the GitHub release.
  publish:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package-linux, package-windows]
    # package-windows is best effort: publish whatever succeeded.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          draft: true
