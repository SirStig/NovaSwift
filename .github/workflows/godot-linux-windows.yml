name: Godot layer (Linux/Windows)

# Guards the cross-platform Swift core and the SwiftGodot bridge that make up the
# desktop Linux/Windows frontend. See docs/GODOT_LAYER.md.
#
# The Apple app (app/NovaSwift, Xcode) is untouched by this workflow — it builds
# only the SwiftPM packages.

# Back on push/PR. It was demoted to manual-only while
# every job died in NovaSwiftKit on `NSData.compressed(using: .lzfse)` — an
# Apple-only Foundation facility that no amount of Godot work could route
# around, since the bridge builds the core first. That is fixed in
# SpriteDiskCache (the record now carries a codec byte and stores raw off
# Apple), so the signal is worth having again.
on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "godot/**"
      - "Package.swift"
      - "scripts/build-gdextension.sh"
      - ".github/workflows/godot-linux-windows.yml"
  pull_request:
    paths:
      - "Sources/**"
      - "godot/**"
      - "Package.swift"
      - "scripts/build-gdextension.sh"
      - ".github/workflows/godot-linux-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

# Every job pins Swift 6.3, the toolchain this code is developed against and the
# minimum SwiftGodot's `main` requires. The jobs previously ran 5.10, which no
# part of the project was ever built or verified against — on Linux its older
# corelibs Foundation lacks `Sendable` conformances the sources assume, and on
# Windows its ucrt module shims can't parse the current Windows SDK headers.
jobs:
  # Required signal: the libraries the Godot layer depends on compile on Linux.
  # These were audited clean of Apple-only frameworks (docs/GODOT_LAYER.md).
  core-linux:
    name: Core builds on Linux
    runs-on: ubuntu-latest
    container: swift:6.3-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Build NovaSwiftEngine (+ NovaSwiftKit)
        run: swift build --target NovaSwiftEngine

  # Informational: the entire root package on Linux (extractor, story, net with
  # its Apple transports compiled out, plugin store). Surfaces any remaining
  # portability gaps without blocking the required check.
  full-core-linux:
    name: Full package on Linux (informational)
    runs-on: ubuntu-latest
    container: swift:6.3-jammy
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build whole package
        run: swift build

  # Informational: the same core on Windows, where Foundation has its own edges.
  #
  # Also pinned to windows-2022, not windows-latest: the latter now means Windows
  # Server 2025 + VS 2026, a much newer MSVC than the Swift toolchain is tested
  # against. Both the runner image and the toolchain matter here — on 5.10 this
  # job failed on *either* image with "cyclic dependency in module 'ucrt'" as
  # soon as anything needed a C module built (swift-crypto's C target was the
  # first dependency to trigger it).
  core-windows:
    name: Core builds on Windows (informational)
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift toolchain
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.3.3-release
          tag: 6.3.3-RELEASE
      - name: Build NovaSwiftEngine (+ NovaSwiftKit)
        run: swift build --target NovaSwiftEngine

  # Informational: the SwiftGodot GDExtension bridge (fetches SwiftGodot, links
  # the native library). Promote to required once verified on a real toolchain.
  # SwiftGodot's `main` (which this bridge is intentionally pinned to — see
  # godot/bridge/Package.swift) is what sets the 6.3 floor shared above.
  bridge-linux:
    name: GDExtension bridge on Linux (informational)
    runs-on: ubuntu-latest
    container: swift:6.3-jammy
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build the NovaSwiftGodot bridge
        run: scripts/build-gdextension.sh release
